                case 'speech': return "bg-white border-[3px] border-black rounded-[20px] text-black shadow-[4px_4px_0px_rgba(0,0,0,0.2)]";
                case 'thought': return "bg-white border-[3px] border-dashed border-gray-400 rounded-[30px] text-gray-600 italic shadow-sm";
                case 'scream': return "bg-yellow-400 border-[3px] border-black text-red-600 text-lg font-black uppercase tracking-wider shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transform -rotate-1";
                case 'whisper': return "bg-gray-800 text-white text-xs rounded-md border border-gray-600 opacity-90";
                case 'caption': return "bg-white border-2 border-black rounded-none shadow-[3px_3px_0_0_#000] font-mono text-xs";
                case 'sfx': return "bg-transparent text-black font-black uppercase tracking-tighter drop-shadow-[2px_2px_0_#fff] border-none p-0 text-2xl";
                case 'label': return "text-xs font-bold px-2 py-1 rounded shadow-md border-2 border-black";
                default: return "bg-white border border-black";
            }
        }

        function renderPanel(panel, idx) {
            let colClass = "col-span-1 h-64";
            if(panel.size === 'wide') colClass = "col-span-2 h-64";
            if(panel.size === 'large') colClass = "col-span-2 h-96";
            if(panel.size === 'small') colClass = "col-span-1 h-40";

            let elementsHtml = panel.elements.map(el => {
                if(el.type === 'icon') return `<i data-lucide="${el.icon}" class="${el.class || ''}"></i>`;
                if(el.type === 'text') return `<div class="${el.class || ''}" style="${el.style || ''}">${el.text}</div>`;
                return `<div class="${el.class || ''}" style="${el.style || ''}"></div>`;
            }).join('');

            let bubblesHtml = panel.bubbles.map(b => `
                <div class="absolute z-20 p-3 text-sm leading-tight font-bold font-sans ${getBubbleStyle(b.type)} ${b.pos}">
                    ${b.speaker ? `<span class="block text-[10px] font-black text-gray-400 mb-1 uppercase tracking-wider">${b.speaker}</span>` : ''}
                    ${b.text}
                </div>
            `).join('');

            return `
                <div class="relative overflow-hidden border-[3px] border-black rounded-lg ${panel.bgStyle} ${colClass} transition-transform hover:scale-[1.01] hover:shadow-xl group">
                    ${elementsHtml}
                    ${bubblesHtml}
                    <div class="absolute top-0 left-0 bg-yellow-400 text-black text-xs font-bold px-2 py-1 border-r-2 border-b-2 border-black rounded-br-lg z-30">
                        ${idx + 1}
                    </div>
                </div>
            `;
        }

        function render() {
            // Update Buttons
            btnScroll.className = `px-4 py-1 text-sm font-bold border-2 border-black rounded-lg shadow-[2px_2px_0_#000] transition-transform active:translate-y-1 active:shadow-none ${state.mode === 'scroll' ? 'bg-orange-500 text-white' : 'bg-white text-black'}`;
            btnPage.className = `px-4 py-1 text-sm font-bold border-2 border-black rounded-lg shadow-[2px_2px_0_#000] transition-transform active:translate-y-1 active:shadow-none ${state.mode === 'page' ? 'bg-orange-500 text-white' : 'bg-white text-black'}`;

            // Update Controls
            btnMute.innerHTML = state.isMuted ? '<i data-lucide="volume-x" class="w-6 h-6 text-gray-500"></i>' : '<i data-lucide="volume-2" class="w-6 h-6 text-green-600"></i>';
            btnPlay.innerHTML = state.isPlaying ? '<i data-lucide="pause" class="w-8 h-8 text-white fill-current"></i>' : '<i data-lucide="play" class="w-8 h-8 text-white fill-current"></i>';
            btnPlay.className = `border-2 border-black p-4 rounded-full shadow-[4px_4px_0_#000] hover:translate-y-[2px] hover:shadow-[2px_2px_0_#000] transition-all ${state.isPlaying ? 'bg-red-500' : 'bg-green-500'}`;
            
            // Header Visibility
            navbar.style.transform = state.isPlaying ? 'translateY(-100%)' : 'translateY(0)';
            app.style.paddingTop = state.isPlaying ? '1rem' : '6rem';

            if (state.mode === 'scroll') {
                const pagesHtml = comicData.map((page, pIdx) => `
                    <div class="bg-white border-[3px] border-black rounded-xl shadow-[8px_8px_0_rgba(0,0,0,0.2)] p-4 md:p-6 overflow-hidden relative mb-8">
                        <div class="absolute top-0 right-0 w-16 h-16 bg-yellow-200 transform rotate-45 translate-x-8 -translate-y-8 border-l-2 border-b-2 border-black"></div>
                        <h2 class="text-center font-black text-xl text-black mb-6 border-b-[3px] border-dashed border-gray-300 pb-2 flex justify-center items-center gap-2">
                           <span class="bg-black text-white px-2 py-1 rounded text-sm">P${page.pageNum}</span>
                           ${page.title}
                        </h2>
                        <div class="grid grid-cols-2 gap-4">
                            ${page.panels.map((p, idx) => renderPanel(p, idx)).join('')}
                        </div>
                    </div>
                `).join('');
                
                const endCard = `
                    <div class="bg-black text-white p-8 text-center rounded-xl border-[3px] border-yellow-400 shadow-[8px_8px_0_rgba(0,0,0,0.2)]">
                        <h3 class="text-2xl font-black mb-2 text-yellow-400">关注我看更多！</h3>
                        <p class="text-gray-400">点赞 + 收藏 + 转发</p>
                        <div class="flex justify-center gap-4 mt-4">
                            <i data-lucide="music" class="w-8 h-8 animate-bounce"></i>
                            <i data-lucide="smile" class="w-8 h-8 animate-bounce delay-100"></i>
                            <i data-lucide="zap" class="w-8 h-8 animate-bounce delay-200"></i>
                        </div>
                    </div>
                `;
                app.innerHTML = `<div class="space-y-8">${pagesHtml}${endCard}</div>`;
            } else {
                const page = comicData[state.currentPage];
                app.innerHTML = `
                    <div class="bg-white border-[3px] border-black rounded-xl shadow-[8px_8px_0_rgba(0,0,0,0.2)] p-4 md:p-8 min-h-[70vh] flex flex-col justify-center relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-24 h-24 bg-orange-200 rounded-bl-full z-0 opacity-50"></div>
                        <div class="flex justify-between items-center mb-6 border-b-[3px] border-black pb-2 relative z-10">
                            <h2 class="font-black text-xl">${page.title}</h2>
                            <span class="text-sm font-bold bg-black text-white px-3 py-1 rounded-full">${state.currentPage + 1} / ${comicData.length}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-4 mb-8 relative z-10">
                             ${page.panels.map((p, idx) => renderPanel(p, idx)).join('')}
                        </div>
                        <div class="flex justify-between mt-auto relative z-10">
                           <button onclick="changePage(-1)" ${state.currentPage === 0 ? 'disabled' : ''} class="px-6 py-3 bg-white border-2 border-black rounded-lg font-bold shadow-[4px_4px_0_#000] hover:translate-y-[2px] hover:shadow-[2px_2px_0_#000] disabled:opacity-50 disabled:shadow-none disabled:translate-y-0 transition-all">上一页</button>
                           <button onclick="changePage(1)" ${state.currentPage === comicData.length - 1 ? 'disabled' : ''} class="px-6 py-3 bg-orange-500 text-white border-2 border-black rounded-lg font-bold shadow-[4px_4px_0_#000] hover:translate-y-[2px] hover:shadow-[2px_2px_0_#000] disabled:opacity-50 disabled:shadow-none disabled:translate-y-0 transition-all">下一页</button>
                        </div>
                    </div>
                `;
            }

            // Render Icons
            lucide.createIcons();
        }

        // --- 交互逻辑 ---

        window.setMode = (mode) => {
            state.mode = mode;
            stopAutoPlay();
            render();
        };

        window.changePage = (delta) => {
            const newPage = state.currentPage + delta;
            if(newPage >= 0 && newPage < comicData.length) {
                state.currentPage = newPage;
                render();
            }
        };

        window.toggleMute = () => {
            state.isMuted = !state.isMuted;
            audioRef.muted = state.isMuted;
            render();
        };

        window.toggleAutoPlay = () => {
            if(state.isPlaying) stopAutoPlay();
            else startAutoPlay();
        };

        function startAutoPlay() {
            state.isPlaying = true;
            setMode('scroll'); // Switch to scroll mode
            
            if (!state.isMuted) {
                audioRef.play().catch(e => console.log("Audio play blocked", e));
            }

            if (state.scrollInterval) clearInterval(state.scrollInterval);
            
            // Auto Scroll
            state.scrollInterval = setInterval(() => {
                window.scrollBy(0, 1);
                // Stop at bottom
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 2) {
                    stopAutoPlay();
                }
            }, 15);
            render();
        }

        function stopAutoPlay() {
            state.isPlaying = false;
            audioRef.pause();
            if (state.scrollInterval) {
                clearInterval(state.scrollInterval);
                state.scrollInterval = null;
            }
            render();
        }

        // Initial Render
        render();

    </script>
</body>
</html>
